<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#176B4A">
  <title>Acesso restrito — Movimente-se</title>
  <script src="js/script.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <button class="theme-toggle login-theme" type="button" aria-label="Ativar tema escuro" title="Ativar tema escuro"><span class="theme-toggle__icon theme-toggle__sun" aria-hidden="true">☀</span><span class="theme-toggle__icon theme-toggle__moon" aria-hidden="true">◐</span></button>
    <a class="brand" href="index.html"><img src="assets/optimized/logo.webp" alt="" width="42" height="42"><span>Movimente-se</span></a>
    <h1>Acesso restrito</h1>
    <p>Área destinada à equipe autorizada. Participantes não precisam entrar para consultar as atividades.</p>
    <form method="post" action="/login">
      <div class="form-field"><label for="cpf">CPF</label><input id="cpf" type="text" name="cpf" inputmode="numeric" autocomplete="username" pattern="[0-9]{11}" maxlength="11" placeholder="Somente números" required></div>
      <div class="form-field"><label for="email">E-mail institucional</label><input id="email" type="email" name="email" autocomplete="email" required></div>
      <button class="button button--primary" type="submit">Entrar</button>
    </form>
    <a class="login-back" href="index.html">← Voltar ao site público</a>
  </main>
</body>
</html>
